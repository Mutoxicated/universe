[package]
name = "universe"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
glam = "0.33.3"
pollster = "0.3"
bytemuck = "1.25.2"
easy-gltf = "1.1.5"

[profile.release]
debug = "full"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
